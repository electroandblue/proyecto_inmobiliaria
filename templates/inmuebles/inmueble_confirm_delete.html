<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Inmueble - Portal Inmobiliario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'home' %}">Portal Inmobiliario</a>
            <a href="{% url 'perfil' %}" class="btn btn-outline-light btn-sm">Volver al Perfil</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0">Confirmar Eliminación</h5>
                    </div>
                    <div class="card-body p-4 text-center">
                        <p class="fs-5">¿Estás seguro de que deseas eliminar permanentemente el inmueble?</p>
                        <p class="fw-bold text-danger fs-4">"{{ inmueble.nombre }}"</p>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-3 mt-4">
                                <a href="{% url 'perfil' %}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
